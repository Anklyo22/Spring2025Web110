<!--Form Page--!>
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Questionaire</title>
	<link rel="stylesheet" href="stylesforform.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

	<body>
		<div class="page">

			<h3>How Was This Site?</h3>

			<p>I value your feedback. How can I improve this website?</p>

			<form action="https://formspree.io/f/mojrvojr" method="POST">

				<label for="DateAndTime">Date and Time of Visit:</label>
				<input type="text" id="DateandTime" name="DateAndTime" required>

				<label for="Pros">What Did You Like:</label>
				<input type="text" id="pros" name="pros" required>

				<label for="cons">What Did You not like:</label>
				<input type="text" id="cons" name="cons">

				<label for="topic">Rating:</label>
				<select id="topic" name="topic">
					<option value="5">5</option>
					<option value="4">4</option>
					<option value="3">3</option>
					<option value="2">2</option>
					<option value="1">1</option>
				</select>

				<div class="message">
					<label for="message">Message:</label>
					<textarea id="message" name="message" rows="5" required></textarea>
				</div>
				<div class="Button">
				<input type="submit" value="Send Message">

			</form>
	
			<div class="list">
				<nav>
					<ul>
						<li><a href="final1.html">Home</a></li>
						<li><a href="final2.html">Extra Details</a></li>
						<li><a href="final4.html">Credits Page</a></li>
					</ul>
				</nav>
			</div>
		</div>

	</body>
</html>
